spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/evshare;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.flyway.enabled=false

# Paytm staging by default; never commit merchant secrets
paytm.environment=${PAYTM_ENVIRONMENT:STAGING}
paytm.mid=${PAYTM_MID:}
paytm.merchant-key=${PAYTM_MERCHANT_KEY:}
paytm.website-name=${PAYTM_WEBSITE_NAME:WEBSTAGING}
paytm.callback-url=${PAYTM_CALLBACK_URL:}
paytm.checkout-script=${PAYTM_CHECKOUT_SCRIPT:https://securestage.paytmpayments.com/merchantpgpui/checkoutjs/merchants/}

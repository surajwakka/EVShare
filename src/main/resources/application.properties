spring.application.name=EVShare
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
info.app.name=EVShare
info.app.description=Community EV home-charging marketplace
info.app.version=1.3.0
server.error.include-message=never
server.error.include-binding-errors=never


# Paytm staging integration (disabled until merchant credentials are supplied)
paytm.environment=${PAYTM_ENVIRONMENT:STAGING}
paytm.mid=${PAYTM_MID:}
paytm.merchant-key=${PAYTM_MERCHANT_KEY:}
paytm.website-name=${PAYTM_WEBSITE_NAME:WEBSTAGING}
paytm.callback-url=${PAYTM_CALLBACK_URL:}
paytm.checkout-script=${PAYTM_CHECKOUT_SCRIPT:https://securestage.paytmpayments.com/merchantpgpui/checkoutjs/merchants/}

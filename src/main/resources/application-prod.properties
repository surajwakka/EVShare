# Production must use managed PostgreSQL and a secret-managed connection string.
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.forward-headers-strategy=framework
server.compression.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Paytm staging by default; never commit merchant secrets
paytm.environment=${PAYTM_ENVIRONMENT:STAGING}
paytm.mid=${PAYTM_MID:}
paytm.merchant-key=${PAYTM_MERCHANT_KEY:}
paytm.website-name=${PAYTM_WEBSITE_NAME:WEBSTAGING}
paytm.callback-url=${PAYTM_CALLBACK_URL:}
paytm.checkout-script=${PAYTM_CHECKOUT_SCRIPT:https://securestage.paytmpayments.com/merchantpgpui/checkoutjs/merchants/}
